[project]
name = "label-relaxation"
version = "0.1.0"
description = "Label relaxation loss for PyTorch — calibrated classification with credal targets (Lienen & Hüllermeier, AAAI 2021)"
readme = "README.md"
authors = [
    { name = "Julian Lienen", email = "julianlienen@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
keywords = ["label-relaxation", "label-smoothing", "calibration", "credal-sets", "pytorch", "loss-function"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/julilien/LabelRelaxation"
Paper = "https://ojs.aaai.org/index.php/AAAI/article/view/17041"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# legacy/ on the path: the original AAAI 2021 code serves as the equivalence-test oracle.
pythonpath = ["legacy"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "label_relaxation"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
